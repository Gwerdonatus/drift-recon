# PostgreSQL configuration tuned for a 2–4GB VPS
# running the full Docker Compose stack.
#
# Reference: https://pgtune.leopard.in.ua/
# Profile: Web application, 2GB RAM allocated to Postgres

# ── Connections ────────────────────────────────────────────────────────────────
max_connections = 100               # Pool size * workers must stay under this
# With pool_size=10, max_overflow=20, 2 uvicorn workers: max 60 connections

# ── Memory ────────────────────────────────────────────────────────────────────
shared_buffers = 512MB              # 25% of allocated RAM
effective_cache_size = 1GB          # Estimate of OS page cache available
maintenance_work_mem = 128MB        # For VACUUM, CREATE INDEX
work_mem = 8MB                      # Per-sort/hash operation per connection
                                    # work_mem * max_connections = ~800MB peak

# ── Write-Ahead Log ───────────────────────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9  # Spread checkpoint I/O
min_wal_size = 1GB
max_wal_size = 4GB

# ── Query Planner ─────────────────────────────────────────────────────────────
default_statistics_target = 100
random_page_cost = 1.1              # SSD assumption (lower = prefer index scans)
effective_io_concurrency = 200      # SSD concurrent I/O

# ── Logging ───────────────────────────────────────────────────────────────────
log_min_duration_statement = 1000   # Log queries slower than 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off               # Too noisy with connection pooling
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ── Autovacuum ────────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# ── Timezone ──────────────────────────────────────────────────────────────────
timezone = 'UTC'
log_timezone = 'UTC'

# ── Misc ──────────────────────────────────────────────────────────────────────
listen_addresses = '*'
