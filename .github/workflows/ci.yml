# CI/CD Pipeline
#
# Triggers:
#   - Push to main → run tests + build images
#   - Push to any PR branch → run tests only (no deploy)
#   - Manual dispatch → run tests + optional deploy
#
# Required GitHub Secrets:
#   POSTGRES_PASSWORD       — DB password for CI test DB
#   DEPLOY_SSH_KEY          — Private key for VPS SSH access
#   DEPLOY_HOST             — VPS IP or hostname
#   DEPLOY_USER             — SSH user (e.g., ubuntu)
#   SECRET_KEY              — App secret key
#   API_KEY_SALT            — API key salt
#   VALID_API_KEYS          — Comma-separated API keys
#   REDIS_PASSWORD          — Redis password
#   ALERT_WEBHOOK_URL       — (Optional) Slack webhook

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after tests?"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names.
  IMAGE_NAME: gwerdonatus/drift-recon
  PYTHON_VERSION: "3.12"

jobs:

  # ── Lint & Type Check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install ruff==0.4.4 black==24.4.2 mypy==1.10.0
          pip install -r requirements.txt

      - name: Run ruff (fast linter)
        run: ruff check app/ tests/

      - name: Run black (format check)
        run: black --check app/ tests/

      - name: Run mypy (type check)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Type errors are warnings until codebase is fully typed

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recon_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: recon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://recon_user:testpassword@localhost:5432/recon_test
      TEST_DATABASE_URL: postgresql+asyncpg://recon_user:testpassword@localhost:5432/recon_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test_secret_key_minimum_32_characters_long
      API_KEY_SALT: test_salt_16chars
      VALID_API_KEYS: test_key_1234567890abcdef
      REDIS_PASSWORD: ""
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: recon_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      LOG_LEVEL: WARNING
      WEIGHT_AMOUNT: "0.50"
      WEIGHT_DATE: "0.25"
      WEIGHT_REFERENCE: "0.15"
      WEIGHT_DESCRIPTION: "0.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  dashboard-check:
    name: Dashboard dependency smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r dashboard/requirements.txt
      - run: |
          python -c "import numpy, pandas, pyarrow, streamlit; import pyarrow as pa; pa.table({'amount': [100]})"
      - run: python -m py_compile dashboard/app.py

  # ── Build & Push Image ───────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true' &&
      github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval if configured in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GITHUB_SHA
          script: |
            set -euo pipefail

            cd /opt/drift-recon

            echo "=== Pulling latest images ==="
            docker compose pull api dashboard

            echo "=== Running pre-deploy healthcheck ==="
            # Keep old container running while we verify the new image starts
            docker compose run --rm --no-deps api python -c "from app.config import get_settings; get_settings(); print('Config OK')"

            echo "=== Deploying with zero-downtime rolling restart ==="
            # Scale to 0 first to avoid migration conflicts, then bring up
            docker compose up -d --no-deps --force-recreate api dashboard

            echo "=== Waiting for API to be healthy ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "API is healthy after ${i} attempts"
                break
              fi
              echo "Attempt $i: not ready yet, waiting 5s..."
              sleep 5
              if [ $i -eq 12 ]; then
                echo "DEPLOY FAILED: API did not become healthy"
                # Rollback: restart previous containers
                docker compose up -d --force-recreate api
                exit 1
              fi
            done

            echo "=== Removing old images ==="
            docker image prune -f

            echo "=== Deploy complete: $GITHUB_SHA ==="

      - name: Notify deployment
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            STATUS="${{ job.status }}"
            SHA="${{ github.sha }}"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) deploy=$STATUS sha=$SHA" >> /opt/drift-recon/deployments.log
