[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show slowest 10 tests
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

markers =
    unit: Pure unit tests (no DB, no I/O)
    integration: Tests that require a real database
    slow: Tests that take > 5 seconds

filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:pydantic

env =
    TEST_DATABASE_URL=postgresql+asyncpg://recon_user:5ffaaacdfd7548a99f5e5dda22344cc6@localhost:5433/recon_test
    VALID_API_KEYS=test_key_1234567890abcdef